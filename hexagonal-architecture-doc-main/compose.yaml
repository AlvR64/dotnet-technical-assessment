services:
  api:
    build:
      context: .
      dockerfile: src/GtMotive.Estimate.Microservice.Host/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ApplyMigrations: "true"
      ConnectionStrings__Renting: Host=db;Port=5432;Database=renting;Username=renting;Password=renting-local
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: renting
      POSTGRES_USER: renting
      POSTGRES_PASSWORD: renting-local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renting -d renting"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
